<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Reino de la Noche Azul</title>

  <!-- Meta descripción SEO limpia, sin todo en mayúsculas -->
  <meta
    name="description"
    content="El Reino de la Noche Azul. Antes de comenzar tu aventura, escribe el nombre de tu héroe. Escribe de 1 a 16 caracteres para continuar."
  />

  <!-- Open Graph para compartir en redes sociales / mensajería -->
  <meta property="og:title" content="El Reino de la Noche Azul" />
  <meta
    property="og:description"
    content="El Reino de la Noche Azul. Antes de comenzar tu aventura, escribe el nombre de tu héroe. Escribe de 1 a 16 caracteres para continuar."
  />
  <meta property="og:type" content="website" />

  <!-- Favicon limpio en SVG (sin texto 'Render' ni ícono externo de alojamiento) -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231d4ed8'/%3E%3Cstop offset='100%25' stop-color='%230f172a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 12 L36.5 27.5 L52 32 L36.5 36.5 L32 52 L27.5 36.5 L12 32 L27.5 27.5 Z' fill='%2393c5fd'/%3E%3C/svg%3E"
  />

  <style>
    :root {
      --bg-dark: #060b19;
      --bg-card: rgba(15, 23, 42, 0.88);
      --border: rgba(147, 197, 253, 0.22);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --glow: rgba(59, 130, 246, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #172554 0%, var(--bg-dark) 68%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px var(--glow);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.4px;
      color: #93c5fd;
      background: rgba(30, 58, 138, 0.45);
      border: 1px solid rgba(147, 197, 253, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(2, 6, 23, 0.75);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-muted);
      min-height: 18px;
    }

    .error {
      color: #fca5a5;
    }

    .welcome-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(30, 58, 138, 0.28);
      border: 1px solid rgba(147, 197, 253, 0.28);
      display: none;
    }

    .welcome-box.active {
      display: block;
    }

    .welcome-box h2 {
      font-size: 17px;
      margin-bottom: 6px;
      color: #bfdbfe;
    }

    .welcome-box p {
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Aventura interactiva</span>
    <h1>El Reino de la Noche Azul</h1>
    <p class="subtitle">
      Antes de comenzar tu aventura, escribe el nombre de tu héroe. Escribe de 1 a 16 caracteres para continuar.
    </p>

    <form id="heroForm" novalidate>
      <label for="heroName">Nombre del héroe</label>
      <div class="input-row">
        <input
          id="heroName"
          name="heroName"
          type="text"
          maxlength="16"
          placeholder="Ej. Valeria"
          autocomplete="off"
        />
        <button type="submit">Continuar</button>
      </div>
      <div class="meta-row">
        <span id="feedbackMessage"></span>
        <span id="charCount">0 / 16</span>
      </div>
    </form>

    <section id="welcomeBox" class="welcome-box" aria-live="polite">
      <h2 id="welcomeTitle"></h2>
      <p id="welcomeText"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("heroForm");
    const input = document.getElementById("heroName");
    const feedback = document.getElementById("feedbackMessage");
    const charCount = document.getElementById("charCount");
    const welcomeBox = document.getElementById("welcomeBox");
    const welcomeTitle = document.getElementById("welcomeTitle");
    const welcomeText = document.getElementById("welcomeText");

    function updateCount() {
      const len = input.value.length;
      charCount.textContent = `${len} / 16`;
      if (len > 0 && feedback.classList.contains("error")) {
        feedback.textContent = "";
        feedback.classList.remove("error");
      }
    }

    input.addEventListener("input", updateCount);

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const name = input.value.trim();

      if (name.length < 1 || name.length > 16) {
        feedback.textContent = "Escribe un nombre de 1 a 16 caracteres.";
        feedback.classList.add("error");
        welcomeBox.classList.remove("active");
        input.focus();
        return;
      }

      feedback.textContent = "";
      feedback.classList.remove("error");
      welcomeTitle.textContent = `¡Te damos la bienvenida, ${name}!`;
      welcomeText.textContent = `Tu viaje por El Reino de la Noche Azul está listo para comenzar.`;
      welcomeBox.classList.add("active");
    });
  </script>
</body>
</html>
